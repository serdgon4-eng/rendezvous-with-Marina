<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121f">
<title>Марина — Симулятор свиданий</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">СИМУЛЯТОР СВИДАНИЙ</div>
      <h1>Марина</h1>
    </div>
    <button id="resetBtn" class="ghost">Сбросить</button>
  </header>

  <main>
    <section id="homeScreen" class="screen active">
      <div class="hero">
        <div class="hero-copy">
          <span class="pill">5 образов · 100 реплик</span>
          <h2>Познакомься с Мариной в пяти разных мирах.</h2>
          <p>Выбирай образ, отвечай на реплики и попробуй построить свою историю.</p>
        </div>
      </div>
      <div id="rolesGrid" class="roles"></div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="game-header">
        <button id="backBtn" class="back">← Образы</button>
        <div class="progress-wrap">
          <div id="roleTitle"></div>
          <div class="progress"><span id="progressBar"></span></div>
        </div>
        <button id="soundBtn" class="sound" aria-label="Звук">🔊</button>
      </div>

      <div class="scene">
        <img id="sceneImage" alt="Марина">
        <div class="scene-overlay">
          <div id="sceneSubtitle"></div>
        </div>
      </div>

      <div class="dialogue-card">
        <div id="speaker" class="speaker"></div>
        <div id="text" class="dialogue-text"></div>
        <div id="choices" class="choices"></div>
        <button id="nextBtn" class="next hidden">Продолжить →</button>
      </div>
    </section>
  </main>
</div>
<script src="game.js"></script>
</body>
</html>
